# Bot/Scanner blocklist — RETIRED as a static map (issue #392, ADR-0002).
#
# The blocklist is now admin-configurable: the backend compiles the Baseline +
# admin Blocklists into per-server-block rules inside the generated configs in
# /etc/nginx/sites-enabled/ (see apps/backend/src/domains/edge-blocklist.service.ts
# and apps/backend/src/traffic/blocklist-baseline.ts, which superseded the map
# that used to live here). Requests the edge misses are still enforced by the
# application interceptor (ADR-0003).
#
# What remains here exists only for backward compatibility:
#
# - $block_scanner stub: per-domain configs generated by a pre-#392 backend
#   persist on the sites-enabled volume across upgrades and still reference
#   $block_scanner. Without this stub nginx would refuse to start until the
#   backend regenerates them. Always 0 — it blocks nothing.
map $request_uri $block_scanner {
    default 0;
}

# - Rate limiting zones (available for use in server blocks)
limit_req_zone $binary_remote_addr zone=scanner_limit:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
