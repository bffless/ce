# Default HTTP configuration for local development
# This file is used automatically when building the frontend container locally.
# For production SSL/HTTPS setup, see docker/nginx-ssl.conf
#
# Usage:
#   Local: docker compose build frontend (uses this file automatically)
#   Production: Copy nginx-ssl.conf to nginx-prod.conf, then rebuild
#
# See: roadmap/deploy-digitalocean-simple.md for deployment instructions

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large file uploads (e.g., Playwright artifacts, coverage reports)
    client_max_body_size 100M;

    # Increase proxy buffer size for large headers (SuperTokens cookies)
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers for proxied routes are set by the NestJS backend (SecurityHeadersMiddleware)

    # Proxy MCP (Model Context Protocol) requests to backend
    location /mcp {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests to backend
    location /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # NOTE: /auth is SuperTokens' websiteBasePath (client-side SPA routes).
    # The auth API lives at /api/auth (see location /api), so /auth* must NOT
    # be proxied to the backend — it falls through to the SPA fallback below
    # so hard-reloads of /auth routes render client-side.

    # Proxy public asset requests to backend
    location /public {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # React Router - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (but not API/auth/public/repo paths which are handled by React)
    location ~* ^/(?!api/|auth/|public/|repo/).*\.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

