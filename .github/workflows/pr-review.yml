name: PR Review

# Runs the `ce-pr-review` agent (.claude/agents/ce-pr-review.md) headlessly and
# posts its report as a PR comment. The agent reads .claude/ce-pr-review-checklist.md
# on every run, so extending the checklist changes what CI reviews for — no workflow
# edit needed.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

# A new push supersedes an in-flight review of the same PR.
concurrency:
  group: pr-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    name: Agent review
    runs-on: ubuntu-latest
    # Fork PRs receive no secrets and a read-only token, so the agent cannot run or
    # comment. Skip them rather than fail. Review those with the workflow_dispatch
    # input, which runs from the base repo.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          # MUST stay pinned to base. On a pull_request event actions/checkout
          # defaults to refs/pull/<n>/merge, which already contains the PR's own
          # changes — and the agent reads its instructions (its definition and
          # .claude/ce-pr-review-checklist.md) from this checkout. Unpinned, a PR
          # that edits those files controls its own review, which defeats the whole
          # "PR content is data, not instructions" property.
          # The PR's code is read as text via `gh pr diff`, never executed.
          ref: ${{ github.event.pull_request.base.sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run review agent
        id: review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          claude -p "Review pull request #${PR} in this repository. Output only the review report as GitHub-flavoured markdown, ready to post as a PR comment." --agent ce-pr-review --model claude-sonnet-5 --output-format text --allowedTools "Read" "Grep" "Glob" "Bash(gh pr view:*)" "Bash(gh pr diff:*)" "Bash(gh pr checks:*)" "Bash(gh pr list:*)" "Bash(git show:*)" "Bash(git log:*)" "Bash(git diff:*)" > review.md
          echo "--- review output ---"
          cat review.md

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          if [ ! -s review.md ]; then echo "Empty review, nothing to post."; exit 0; fi
          printf '## 🤖 Automated CE review\n\n' > comment.md
          cat review.md >> comment.md
          printf '\n\n---\n<sub>Generated by the `ce-pr-review` agent. Advisory only — not an approval.</sub>\n' >> comment.md
          gh pr comment "$PR" --body-file comment.md
